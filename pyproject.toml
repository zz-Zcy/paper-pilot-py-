[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperpilot"
version = "0.1.0"
description = "Your arXiv paper co-pilot"
requires-python = ">=3.9"
dependencies = [
    "arxiv>=1.4",
    "pdfplumber>=0.10",
    "typer>=0.9",
    "rich>=13.0",
    "ollama>=0.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
paperpilot = "paperpilot.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/paperpilot"]

[tool.black]
line-length = 100